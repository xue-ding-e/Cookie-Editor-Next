name: Validate source (no release)

on:
  workflow_dispatch:
  push:
    branches: [fix/n8n-stale-close-continuation, fix/n8n-stale-reconnect-read, fix/n8n-cancel-pending-permission, fix/n8n-retired-alarm-read, fix/n8n-cancel-pending-storage, test/n8n-replacement-waiter]

permissions:
  contents: read

concurrency:
  group: cookie-editor-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_WEBSITE: https://cookieeditor.org
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test pure Cookie import transformations
        run: npm test
      - name: Check popup source contract when present
        run: |
          if [ -f tests/popup-compatibility.test.mjs ]; then
            node --test tests/popup-compatibility.test.mjs
          fi
      - name: Test pure text Cookie parsing when present
        run: |
          if [ -f tests/cookie-text-import.test.mjs ]; then
            node --test tests/cookie-text-import.test.mjs
          fi
      - name: Test actual browser-facing handlers with mocked APIs when present
        run: |
          if [ -f tests/cookie-import-handler.test.mjs ]; then
            node --test tests/cookie-import-handler.test.mjs
          fi
          if [ -f tests/cookie-tab-state.test.mjs ]; then
            node --test tests/cookie-tab-state.test.mjs
          fi
          if [ -f tests/cookie-edit-handler.test.mjs ]; then
            node --test tests/cookie-edit-handler.test.mjs
          fi
      - name: Test n8n socket lifecycle with synthetic boundaries
        run: node --test tests/n8n-*.test.mjs
      - name: Compile extension without installation or browser access
        run: npm run build
