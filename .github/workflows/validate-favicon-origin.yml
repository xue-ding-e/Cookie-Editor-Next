name: Validate Cookie favicon origin
on:
  push:
    branches: [ci/validate-cookie-favicon-origin-20261108]
permissions:
  contents: read
concurrency:
  group: cookie-favicon-origin-validation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    if: github.repository == 'xue-ding-e/Cookie-Editor-Next' && github.ref == 'refs/heads/ci/validate-cookie-favicon-origin-20261108'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOURCE_SHA: a95f9cce6f997a10b2034c4ed51772c4bbab45f7
      BASE_SHA: a32be0eade61207adb48fd95b6ee239f437581df
      VITE_WEBSITE: https://cookieeditor.org
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 3
          persist-credentials: false
      - name: Verify the exact source and validation-only commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD^^)" = "$BASE_SHA"
          test "$(git rev-list --parents -n 1 HEAD | wc -w)" -eq 2
          test "$(git rev-list --parents -n 1 "$SOURCE_SHA" | wc -w)" -eq 2
          test "$(git diff --name-only "$SOURCE_SHA" HEAD)" = ".github/workflows/validate-favicon-origin.yml"
          test "$(git diff --name-status "$SOURCE_SHA" HEAD)" = $'A\t.github/workflows/validate-favicon-origin.yml'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install locked dependencies without lifecycle scripts
        run: timeout 300s npm ci --ignore-scripts --no-audit --no-fund
      - name: Test actual React components with synthetic browser boundaries
        run: |
          timeout 180s npm test -- --reporter=json --outputFile=/tmp/cookie-vitest.json
          python3 - <<'PY'
          import json
          report = json.load(open("/tmp/cookie-vitest.json"))
          assert report["success"]
          assert report["numTotalTests"] == report["numPassedTests"] == 82
          assert report["numFailedTests"] == report["numPendingTests"] == 0
          PY
      - name: Test all Node handlers and parsers
        shell: bash
        run: |
          set -euo pipefail
          timeout 120s node --test --test-reporter=tap tests/*.test.mjs | tee /tmp/cookie-node.tap
          python3 - <<'PY'
          import re
          output = open("/tmp/cookie-node.tap").read()
          for key, count in [("tests", 100), ("pass", 100), ("fail", 0), ("cancelled", 0), ("skipped", 0), ("todo", 0)]:
              assert re.search(r"^# " + key + r" " + str(count) + r"$", output, re.M), (key, count)
          PY
      - name: Test packaging without publishing
        run: |
          timeout 60s python3 -B - <<'PY'
          import unittest
          suite = unittest.defaultTestLoader.discover("tests", pattern="test_package_extension.py")
          assert suite.countTestCases() == 8
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          assert result.wasSuccessful() and result.testsRun == 8 and not result.skipped
          PY
      - name: Compile extension without installation or browser access
        run: timeout 180s npm run build
      - name: Ensure validation did not modify tracked source
        run: |
          git diff --exit-code
          git diff --cached --exit-code

